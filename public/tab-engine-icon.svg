<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Tab Engine app icon</title>
  <desc>A royal purple rounded-square mark with a stylized tablature E formed from stacked horizontal string lines and a piston bar.</desc>
  <defs>
    <linearGradient id="pviolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B3FE8"/>
      <stop offset="1" stop-color="#5A1FB8"/>
    </linearGradient>
    <linearGradient id="pvioletLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A55CFF"/>
      <stop offset="1" stop-color="#7B2FE0"/>
    </linearGradient>
  </defs>

  <rect x="14" y="20" width="92" height="92" rx="22" fill="#3D1582"/>
  <rect x="14" y="14" width="92" height="92" rx="22" fill="url(#pviolet)"/>
  <rect x="14" y="14" width="92" height="46" rx="22" fill="url(#pvioletLight)" opacity="0.32"/>

  <g stroke="#F0E6FF" stroke-width="5.5" stroke-linecap="round">
    <line x1="40" y1="42" x2="86" y2="42"/>
    <line x1="40" y1="60" x2="78" y2="60"/>
    <line x1="40" y1="78" x2="86" y2="78"/>
  </g>
  <g fill="#F0E6FF">
    <circle cx="40" cy="42" r="5"/>
    <circle cx="40" cy="60" r="5"/>
    <circle cx="40" cy="78" r="5"/>
  </g>
  <rect x="34" y="34" width="6" height="52" rx="3" fill="#1E0A47"/>
</svg>
